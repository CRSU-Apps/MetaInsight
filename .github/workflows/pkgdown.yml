# Workflow derived from https://github.com/r-lib/actions/tree/master/examples
# Need help debugging build failures? Start at https://github.com/r-lib/actions#where-to-find-help
on:
  push:
    branches: [main]
  release:
    types: [published]
  workflow_dispatch:

name: pkgdown

jobs:
  pkgdown:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v7

      - uses: r-lib/actions/setup-pandoc@v2

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      # rjags >= 5-0 requires JAGS 5, which is not yet packaged for Ubuntu, so build it from source.
      # The vignette fits models, so rjags must load for the site to build.
      - name: Install JAGS
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential gfortran pkg-config libblas-dev liblapack-dev
          curl -L https://sourceforge.net/projects/mcmc-jags/files/JAGS/5.x/Source/JAGS-5.0.2.tar.gz/download -o ${{ runner.temp }}/jags.tar.gz
          tar -xzf ${{ runner.temp }}/jags.tar.gz -C ${{ runner.temp }}
          cd ${{ runner.temp }}/JAGS-5.0.2
          ./configure --prefix=/usr/local
          make -j"$(nproc)"
          sudo make install
          sudo ldconfig
          # pak may also apt-install JAGS 4 as a system requirement of rjags; make sure JAGS 5 is found first
          echo "PKG_CONFIG_PATH=/usr/local/lib/pkgconfig" >> $GITHUB_ENV
          PKG_CONFIG_PATH=/usr/local/lib/pkgconfig pkg-config --modversion jags

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::pkgdown, any::XML, local::.
          needs: website
          pak-version: devel # See https://github.com/r-lib/actions/issues/559

      - name: Deploy package
        run: |
          git config --local user.name "$GITHUB_ACTOR"
          git config --local user.email "$GITHUB_ACTOR@users.noreply.github.com"
          Rscript -e 'pkgdown::deploy_to_branch(new_process = FALSE, branch = "docs")'

      - name: checkout gh-pages
        uses: actions/checkout@v6
        with:
          ref: gh-pages
          token: ${{ secrets.GITHUB_TOKEN }}
          submodules: recursive

      - name: update submodule
        run: |
          # Set up git user for committing changes to the submodule
          git config --global user.name "$GITHUB_ACTOR"
          git config --global user.email "$GITHUB_ACTOR@users.noreply.github.com"
          # Enter the submodule directory to update it NB. submodule update does not work
          cd docs
          # Ensure fetch gets all branches
          git config remote.origin.fetch "+refs/heads/*:refs/remotes/origin/*"
          # Fetch the latest changes from the remote repository
          git fetch
          # Checkout the latest changes from the 'docs' branch
          git checkout remotes/origin/docs
          # Return to the parent repository
          cd ..
          # Add the changes
          git add *
          # Commit the changes
          git commit -m "Update submodule"
          # Push the changes
          git push